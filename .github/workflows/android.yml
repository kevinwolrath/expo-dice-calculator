name: Build Android

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: android-deploy-develop
  cancel-in-progress: true

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --ci --runInBand

      - name: Refresh to latest develop
        shell: bash
        run: |
          git fetch origin develop
          git checkout --detach origin/develop

      - name: Increment DiceForge release version
        run: npm run version:increment

      - name: Save allocated release version
        uses: actions/upload-artifact@v4
        with:
          name: allocated-release-version
          path: app.json

      - name: Print DiceForge version
        run: node scripts/print-app-version.js

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Verify generated Android version
        run: node scripts/verify-android-prebuild-version.js

      - name: Restore Android keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          test -s android/app/keystore.jks

      - name: Configure Android release signing
        run: node scripts/configure-android-release-signing.js

      - name: Build signed Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets."
            exit 1
          fi
          ./gradlew bundleRelease

      - name: Verify release AAB signing certificate
        shell: bash
        env:
          EXPECTED_SHA1: "A4:12:9E:A3:B7:70:1B:14:93:55:63:65:4C:31:36:39:93:C4:3E:59"
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "Missing release AAB at $AAB"
            exit 1
          fi
          CERT_OUT=$(keytool -printcert -jarfile "$AAB")
          echo "$CERT_OUT"
          ACTUAL=$(
            printf '%s\n' "$CERT_OUT" \
              | grep -iE 'SHA-?1:' \
              | head -n 1 \
              | sed -E 's/.*SHA-?1:[[:space:]]*//I' \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )
          EXPECTED_NORM=$(
            printf '%s' "$EXPECTED_SHA1" \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )
          if [ -z "$ACTUAL" ]; then
            echo "Could not read SHA1 from the release AAB certificate."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_NORM" ]; then
            echo "Release AAB SHA1 mismatch."
            echo "expected=$EXPECTED_SHA1"
            echo "actual=$ACTUAL"
            exit 1
          fi
          echo "Release AAB SHA1 matches the Play upload certificate."

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Deploy to Google Play Internal Testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: r0adkll/upload-google-play@744d577ff543375f35f60408e13fb32c7caa90ce
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.snackbearer.expodicecalculator
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  persist-version:
    name: Persist deployed Android version
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout latest develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Download allocated release version
        uses: actions/download-artifact@v4
        with:
          name: allocated-release-version
          path: allocated-release-version

      - name: Persist deployed version
        shell: bash
        run: |
          cp allocated-release-version/app.json app.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          if git diff --cached --quiet; then
            echo "No version change to persist."
            exit 0
          fi
          git commit -m "chore: advance Android release version [skip ci]"
          git push origin HEAD:develop
