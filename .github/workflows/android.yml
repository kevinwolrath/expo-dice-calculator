name: Deploy Android to Internal Testing

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --ci --runInBand

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.ANDROID_BUILD }}

      - name: Build and submit to Google Play Internal Testing
        run: eas build --platform android --profile testing --auto-submit --non-interactive
