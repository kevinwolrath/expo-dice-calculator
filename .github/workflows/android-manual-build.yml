name: Android Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diceforge-android-manual-build
  cancel-in-progress: true

jobs:
  build:
    name: Build DiceForge Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci --runInBand
      - name: Increment DiceForge release version
        run: npm run version:increment
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Verify generated Android version
        run: node scripts/verify-android-prebuild-version.js
      - name: Restore Android keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          test -s android/app/keystore.jks
      - name: Configure Android release signing
        run: node scripts/configure-android-release-signing.js
      - name: Build signed Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          ./gradlew bundleRelease
      - name: Verify release AAB signing certificate
        shell: bash
        env:
          EXPECTED_SHA1: "A4:12:9E:A3:B7:70:1B:14:93:55:63:65:4C:31:36:39:93:C4:3E:59"
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          CERT_OUT=$(keytool -printcert -jarfile "$AAB")
          ACTUAL=$(printf '%s\n' "$CERT_OUT" | grep -iE 'SHA-?1:' | head -n 1 | sed -E 's/.*SHA-?1:[[:space:]]*//I' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_NORM=$(printf '%s' "$EXPECTED_SHA1" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_NORM"
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: diceforge-android-manual-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
